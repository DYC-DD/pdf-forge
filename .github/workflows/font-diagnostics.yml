name: Investigate canvas fonts
on:
  pull_request:
    branches: [develop]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  canvas-fonts:
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    strategy:
      fail-fast: false
      matrix:
        fonts: [without-fonts, with-fonts]
    steps:
      - name: Install system tools
        run: |
          apt-get update
          apt-get install -y ca-certificates git
          if [ '${{ matrix.fonts }}' = with-fonts ]; then
            apt-get install -y fontconfig fonts-dejavu-core fonts-liberation
            fc-cache -f
          fi
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - run: npm install --global "$(node --print "require('./package.json').packageManager")"
      - run: npm ci
      - name: Report font availability
        run: |
          node --input-type=module -e 'import {createCanvas,GlobalFonts} from "@napi-rs/canvas"; const c=createCanvas(200,50).getContext("2d");c.font="12px Arial";c.fillText("Colored heading",0,20); console.log("families",JSON.stringify(GlobalFonts.families));console.log("width",c.measureText("Colored heading").width);console.log("ink",c.getImageData(0,0,200,50).data.reduce((n,v,i)=>n+(i%4===3&&v>0),0));'
      - name: Run scan tests
        run: npm test -- src/tests/pdf2docx-editable-scan.test.ts
