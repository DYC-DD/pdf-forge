name: CI checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Set up npm and report versions
        run: |
          npm install --global "$(node --print "require('./package.json').packageManager")"
          node --version
          npm --version
      - name: Install dependencies
        run: npm ci
      - name: Install fonts for canvas tests
        uses: ./.github/actions/setup-test-fonts
      - name: Run tests
        run: npm test
      - name: Build site
        run: npm run build
